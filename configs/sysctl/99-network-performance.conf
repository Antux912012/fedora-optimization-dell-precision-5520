# ==============================================================================
# Linux TCP/IP & Network Performance Tuning
# Hardware: Dell Precision 5520 / XPS 15 9560
# ==============================================================================

# TCP Congestion Control (BBR + Fair Queueing)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP responsiveness & web browsing latency
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# Buffer ceilings (16MB maximum window size for gigabit transfers & streaming)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Network packet backlog & connection queue limits
net.core.netdev_max_backlog = 10000
net.core.somaxconn = 8192

# Protect against TIME_WAIT socket exhaustion and reduce linger time
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
